# Mapa na żywo MeshCore Południe — Docker Compose (Ubuntu na Proxmoxie, NAS, Raspberry Pi…)
# 1. cp .env.exemple .env  i dostosuj.   2. docker compose up -d --build
# 3. Otwórz http://IP_SERWERA:8095 — kreator utworzy konto administratora.
# Aktualizacja: git pull && docker compose up -d --build
#
# Polska wersja live-mesh-map-world (F4GLD, GPL-3.0). Tylko MeshCore: usługi Meshtastic usunięte.

services:
  carte-live:
    build: .
    image: live-mesh-map-pl:local
    container_name: live-mesh-map-pl
    restart: unless-stopped
    env_file: .env
    environment:
      FICHIER_BASE: /data/carte-live.db
      TZ: Europe/Warsaw
    ports:
      - "${CARTE_PORT:-8095}:8095"
      # Agenci (węzeł USB na innym PC): tylko sieć lokalna lub VPN, NIGDY nie przekierowuj tego portu w routerze
      - "${AGENTS_PORT_HOTE:-4404}:4404"
    volumes:
      # Baza, konta, ustawienia i pamięć terenu: rób kopię
      - donnees:/data
    # PL: strefa 4 województw = ok. 3,5× większa siatka terenu niż kwadrat 1°
    mem_limit: 1g
    # Companion MeshCore podłączony przez USB do tej maszyny: usuń „#” z OBU linii poniżej (to samo wcięcie
    # co mem_limit) i dopasuj port (ls /dev/ttyACM* /dev/ttyUSB* /dev/serial/by-id/), potem na mapie:
    # Narzędzia › Podłącz moduł › USB serwera
    # devices: ["/dev/ttyACM0:/dev/ttyACM0"]
    # group_add: ["dialout"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Archiwum PostgreSQL (opcjonalne): docker compose --profile postgres up -d, a w .env:
  #   POSTGRES_MOT_DE_PASSE=…   POSTGRES_URL=postgres://carte:…@postgres:5432/carte
  postgres:
    image: postgres:16-alpine
    container_name: carte-live-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: carte
      POSTGRES_DB: carte
      POSTGRES_PASSWORD: ${POSTGRES_MOT_DE_PASSE:-zmien-mnie}
    volumes:
      - postgres:/var/lib/postgresql/data
    mem_limit: 256m

volumes:
  donnees:
  postgres:
